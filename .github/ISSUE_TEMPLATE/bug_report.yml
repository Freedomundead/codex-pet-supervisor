name: Bug report
description: Report a reproducible problem with Timer mode, Windows dispatch, or Labs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timer lifecycle
        - Send Test Now / Desktop dispatch
        - Allowance detection
        - UI/UX
        - Labs
        - Installation
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.14.7"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop / CLI version
      description: If known.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / exact error
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, private project content, and local database files from this report.
          required: true
